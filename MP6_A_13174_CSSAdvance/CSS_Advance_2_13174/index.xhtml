<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Kegiatan Eksklusif</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>

    <div class="form-container">
        <h1>Formulir Pendaftaran Kegiatan</h1>
        
        <form action="" method="post" enctype="multipart/form-data">

            <h3>Data Pendaftar</h3>
            <table cellspacing="0" cellpadding="0" style="width:100%;">
                <tr>
                    <td style="width:32%;">
                        <label for="namaLengkap"><strong>Nama Lengkap</strong></label>
                    </td>
                    <td>
                        <input type="text" id="namaLengkap" name="namaLengkap" size="30" required="required" placeholder="Nama Lengkap" />
                    </td>
                </tr>
                <tr>
                    <td style="width:32%;">
                        <label for="nim"><strong>NIM</strong></label>
                    </td>
                    <td>
                        <input type="text" id="nim" name="nim" size="30" required="required" placeholder="Nomor Induk Mahasiswa" />
                    </td>
                </tr>
                <tr>
                    <td style="width:32%;">
                        <label for="prodi"><strong>Program Studi</strong></label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td style="width:32%;">
                        <strong>Jenis Kelamin</strong>
                    </td>
                    <td>
                        <div class="radio-group">
                            <input type="radio" id="laki" name="jenisK" value="Laki-laki" required="required"/> 
                            <label for="laki">Laki-laki</label>
                            <input type="radio" id="perempuan" name="jenisK" value="Perempuan" required="required" /> 
                            <label for="perempuan">Perempuan</label>
                        </div>
                    </td>
                </tr>
            </table>

            <h3>Pilihan Kegiatan</h3>
            <table cellspacing="0" cellpadding="0" style="width:100%;">
                <tr>
                    <td style="width:32%;">
                        <strong>Jenis Kegiatan</strong>
                    </td>
                    <td>
                        <div class="radio-group">
                            <input type="radio" id="seminar" name="kegiatan" value="Seminar" required="required"/>
                            <label for="seminar">Seminar</label>
                            <input type="radio" id="pelatihan" name="kegiatan" value="Pelatihan" required="required"/>
                            <label for="pelatihan">Pelatihan</label>
                            <input type="radio" id="diskusi" name="kegiatan" value="Diskusi" required="required"/>
                            <label for="diskusi">Diskusi</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="width:32%;" class="top-align">
                        <strong>Bidang Minat</strong>
                    </td>
                    <td>
                        <div class="checkbox-group">
                            <p style="margin: 0 0 8px 0;">
                                <input type="checkbox" id="teknologi" name="minat" value="Teknologi" />
                                <label for="teknologi">Teknologi</label>
                            </p>
                            <p style="margin: 0 0 8px 0;">
                                <input type="checkbox" id="organisasi" name="minat" value="Organisasi" />
                                <label for="organisasi">Organisasi</label>
                            </p>
                            <p style="margin: 0 0 0 0;">
                                <input type="checkbox" id="karier" name="minat" value="Karier"/>
                                <label for="karier">Karier</label>
                            </p>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="width:32%;">
                        <label for="waktu"><strong>Waktu Kegiatan</strong></label>
                    </td>
                    <td>
                        <select id="waktu" name="waktu">
                            <option>Pagi</option>
                            <option>Siang</option>
                            <option>Sore</option>
                        </select>
                    </td>
                </tr>
            </table>

            <h3>Kelengkapan Pendaftaran</h3>
            <table cellspacing="0" cellpadding="0" style="width:100%;">
                <tr>
                    <td style="width:32%;" class="top-align">
                        <label for="harapan">
                            <strong>Harapan Mengikuti Kegiatan</strong>
                        </label>
                    </td>
                    <td>
                        <textarea id="harapan" name="harapan" rows="5" cols="30"></textarea>
                    </td>
                </tr>
                <tr>
                    <td style="width:32%;">
                        <label for="bukti"><strong>Bukti Pembayaran</strong></label>
                    </td>
                    <td>
                        <input type="file" id="bukti" name="bukti" style="color: #cbd5e1;" />
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="submit-cell">
                        <input type="submit" name="kirim" value="KIRIM PENDAFTARAN" />
                    </td>
                </tr>
            </table>
                <input type="checkbox" id="setuju" name="setuju" value="I Agree" required="required"/>
                <label for="setuju" style="font-size: 11px; color:#cbd5e1;"> 
                    I agree to share all my private data to Aheng Corporations and be shared to any 3rd party and be used accordingly.
                </label>
        </form>
        <p id="footer">
            &copy; 2026 Formulir Eksklusif Aheng Corporations &bull; All rights reserved.
        </p>
    </div>

</body>
</html>
